# Wydanie VizuApp: aplikacje budowane tylko przy wydaniu na GitHubie (nie przy kazdym pushu).
#   Releases -> "Draft a new release" -> tag np. v0.3.0 -> Publish: testy, potem do wydania dokladane sa:
#   1. PLC z Windows: VizuApp-setup.exe (instalator, installer.iss), VizuApp-full.zip (pierwsza instalacja, z node.exe), VizuApp-update.zip (aktualizacja z aplikacji,
#      src/server/updater.js - VizuApp na maszynie sam proponuje nowa wersje)
#   2. Telefon z Androidem: VizuApp-android.apk (android/)
#   Wersja = tag bez "v". Recznie: Actions -> Wydanie -> Run workflow (tag istniejacego wydania).
name: Wydanie

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag wydania (np. v0.3.0)'
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  test:
    name: Testy (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  android:
    name: Aplikacja Android (APK)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Symulator offline (wersja statyczna w assets/sim)
        run: |
          npm ci
          node scripts/build-pages.js
          mkdir -p android/app/src/main/assets/sim
          cp -r site/. android/app/src/main/assets/sim/
          rm -f android/app/src/main/assets/sim/.nojekyll
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Budowa APK
        working-directory: android
        run: |
          v="${TAG#v}"
          IFS=. read -r ma mi pa <<< "$v"
          code=$(( ${ma:-0} * 1000000 + ${mi:-0} * 1000 + ${pa:-0} ))
          shell=$(git rev-parse --short=12 HEAD:android)
          gradle --no-daemon assembleRelease -PvizuVersion="$v" -PvizuCode=$code -PshellHash=$shell
          cp app/build/outputs/apk/release/app-release.apk ../VizuApp-android.apk
          echo "$shell" > ../android-shell-$shell.txt
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: |
            VizuApp-android.apk
            android-shell-*.txt

  plc:
    name: Paczka PLC (Windows) i pliki wydania
    needs: [test, android]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: dist
      - name: Paczka PLC
        shell: pwsh
        run: ./build.ps1 -Version ($env:TAG -replace '^v', '') -SkipTests -Zip
      - name: Instalator (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress | Out-Null
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DVersion=$($env:TAG -replace '^v', '')" installer.iss
          if ($LASTEXITCODE) { throw 'ISCC: blad' }
      - name: Pliki do wydania
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload $env:TAG dist/VizuApp-setup.exe dist/VizuApp-update.zip dist/VizuApp-full.zip dist/VizuApp-android.apk (Get-ChildItem dist/android-shell-*.txt).FullName --clobber
          $notes = @"

          ## Do pobrania

          **1. PLC z Windows (komputer maszyny)**
          - Instalacja: ``VizuApp-setup.exe`` - instalator (domyslnie ``D:\VizuApp``): skrot VizuApp na pulpicie i w menu Start, autostart serwera, zapora. Ponowna instalacja zostawia ustawienia i uzytkownikow.
          - Bez instalatora: ``VizuApp-full.zip`` - rozpakuj do ``D:\VizuApp`` i uruchom jako administrator ``install-phone.ps1``.
          - Kolejne wersje: VizuApp sam proponuje aktualizacje (gorny pasek / okno Polaczenie, Admin) - ``VizuApp-update.zip``.

          **2. Telefon z Androidem**
          - ``VizuApp-android.apk`` - zainstaluj z pliku. Aplikacja szuka maszyn z VizuApp w sieci (Wi-Fi / VPN).
          "@
          $body = (gh release view $env:TAG --json body -q .body)
          if ($body -notmatch '## Do pobrania') { gh release edit $env:TAG --notes "$body$notes" }
