plugins { id 'com.android.application' }

// wersja z CI: -PvizuVersion=0.2.15 -PvizuCode=15 (jak paczka na PLC)
def vizuVersion = project.findProperty('vizuVersion') ?: '0.0.0'
def vizuCode = (project.findProperty('vizuCode') ?: '1') as int

android {
    namespace 'pl.promasz.vizuapp'
    compileSdk 34
    defaultConfig {
        applicationId 'pl.promasz.vizuapp'
        minSdk 24
        targetSdk 34
        versionCode vizuCode
        versionName vizuVersion
        // znacznik kodu aplikacji (CI: git rev-parse HEAD:android) - propozycja nowego APK tylko po zmianie
        resValue 'string', 'shell_hash', (project.findProperty('shellHash') ?: 'dev')
    }
    // staly klucz podpisu (CI: sekrety ANDROID_KEYSTORE_B64 / ANDROID_KEYSTORE_PASSWORD) - aktualizacja APK bez
    // odinstalowania wymaga tego samego podpisu; bez klucza (lokalnie) - debug
    def ks = System.getenv('ANDROID_KEYSTORE')
    signingConfigs {
        vizuapp {
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias 'vizuapp'
                keyPassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                storeType 'pkcs12'
            }
        }
    }
    buildTypes {
        release { signingConfig ks ? signingConfigs.vizuapp : signingConfigs.debug; minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
